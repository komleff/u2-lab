name: U2 Lab verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: timeout 240 npm run test:long
      - run: bash .agents/project/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
